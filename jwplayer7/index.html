<script type="text/javascript">
var iptv = "https://live.alarabiya.net/alarabiapublish/alarabiya.smil/playlist.m3u8";
jwplayer("myJWplayer").setup({
"playlist": [ {"image": "",
"sources": [ { "default": false,"file":iptv, "label": "0",

aboutlink:"http://flaxtv.blogspot.com/",
title: 'Basic Video Embed',
description: 'A video with a basic title and description',
skin: {name:"bekle", active:"lime", inactive:"white", background:"rgba(0, 0, 0, 0.3)",}
});
  
// Handle fullscreen detection to keep logo visible
function moveLogoToFullscreen() {
  const logo = document.getElementById('logoText');
  const fullscreenElement = document.fullscreenElement;

  if (fullscreenElement) {
    fullscreenElement.appendChild(logo); // move inside fullscreen
    logo.style.position = "absolute";
  } else {
    document.body.appendChild(logo); // move back to normal
    logo.style.position = "fixed";
  }
}

// Detect fullscreen changes for all browsers
['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'msfullscreenchange']
  .forEach(evt => document.addEventListener(evt, moveLogoToFullscreen));
</script></body></html>
